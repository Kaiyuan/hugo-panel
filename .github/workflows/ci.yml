name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: CGO_ENABLED=1 go vet ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race ./...

      - name: Build
        run: CGO_ENABLED=1 go build -trimpath -o /tmp/hugo-panel ./cmd/hugo-panel

# NOTE: Docker images are built and pushed only by release.yml, on tags that
# match `v*`. Regular pushes and pull requests intentionally do not build any
# image (not even a local/untagged one).
